<!doctype html><html><head><meta charset="utf-8"><title>Serving dish review</title><style>
*{box-sizing:border-box}body{margin:0;background:#302335;color:#fff1d3;font-family:Arial,sans-serif}header{padding:16px 22px;display:flex;align-items:center;gap:12px}h1{font-size:20px;margin:0 auto 0 0}button{background:#624760;color:#fff1d3;border:1px solid #ad8b9f;border-radius:7px;padding:9px;cursor:pointer}button[aria-pressed=true]{background:#a8debd;color:#253b30}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:0 20px 20px}.card{background:#47314b;border:1px solid #83607c;border-radius:14px;overflow:hidden}.viewport{height:210px;cursor:grab;touch-action:none}.caption{padding:13px;font-size:13px}.caption small{display:block;color:#c9afc1;font-size:10px;margin-top:4px}canvas{position:fixed;inset:0;pointer-events:none}header,.caption{position:relative;z-index:1}@media(max-width:850px){#grid{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}}
</style></head><body><header><h1>Ten dishes · drag to rotate</h1><button data-view="three" aria-pressed="true">Three-quarter</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="top">Top</button><button data-view="bottom">Bottom</button></header><div id="grid"></div><canvas id="studio"></canvas><script type="module">
import * as THREE from 'three';import {createServingDish,SERVING_DISHES} from '/src/serving-dishes.ts';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#studio'),alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scenes=[];
for(const [recipe,style] of Object.entries(SERVING_DISHES)){
 const card=document.createElement('section');card.className='card';card.innerHTML='<div class="viewport" aria-label="Rotate '+style.name+'"></div><div class="caption"><b>'+style.name+'</b><small>'+recipe.toUpperCase()+' · '+style.kind.toUpperCase()+'</small></div>';document.querySelector('#grid').append(card);
 const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x665164,2));const light=new THREE.DirectionalLight(0xffefd8,2.4);light.position.set(-3,5,5);scene.add(light);const mount=new THREE.Group();scene.add(mount);const dish=createServingDish(recipe);dish.position.y=-style.height/2;mount.add(dish);mount.rotation.set(.4,-.3,0);const camera=new THREE.PerspectiveCamera(36,1,.1,30);camera.position.set(0,0,5.4);const view=card.querySelector('.viewport');scenes.push({scene,mount,camera,view});let drag;
 view.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY};view.setPointerCapture(event.pointerId)});view.addEventListener('pointermove',event=>{if(!drag)return;mount.rotation.y+=(event.clientX-drag.x)*.012;mount.rotation.x+=(event.clientY-drag.y)*.012;drag={x:event.clientX,y:event.clientY}});for(const type of ['pointerup','pointercancel'])view.addEventListener(type,()=>drag=undefined);
}
for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>{for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b===button));const value=button.dataset.view;for(const {mount}of scenes)mount.rotation.set(value==='top'?Math.PI/2:value==='bottom'?-Math.PI/2:value==='three'?.4:0,value==='side'?Math.PI/2:value==='back'?Math.PI:value==='three'?-.3:0,0)});
function draw(){renderer.setSize(innerWidth,innerHeight,false);renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);for(const {scene,camera,view} of scenes){const r=view.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setViewport(r.left,innerHeight-r.bottom,r.width,r.height);renderer.setScissor(r.left,innerHeight-r.bottom,r.width,r.height);renderer.render(scene,camera)}requestAnimationFrame(draw)}draw();
</script></body></html>
